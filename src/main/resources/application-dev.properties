# SSL Configuration (commented out for development)
# server.ssl.key-store=classpath:certs/keystore.p12
# server.ssl.key-store-type=PKCS12
# server.ssl.key-store-password=password
# server.ssl.key-alias=localhost
server.port=8081

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:authkit_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Email configuration - using environment variables from .env
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.from.email=${SPRING_MAIL_FROM_EMAIL:noreply@marcoswiendl.com}
spring.mail.from.name=${SPRING_MAIL_FROM_NAME:AuthKit}
spring.mail.default-encoding=UTF-8

# JWT Configuration for development
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-token.expiration=604800000

# Frontend URL for development
app.frontend.url=http://localhost:3000

# WebAuthn Configuration for development
app.webauthn.rp.id=localhost
app.webauthn.rp.name=AuthKit Dev
app.webauthn.rp.origin=http://localhost:3000